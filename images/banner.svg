<svg viewBox="0 0 1600 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Banner Brown Market">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="55%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="#3a2c1a"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5b041"/>
      <stop offset="100%" stop-color="#e08e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f5b041" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f5b041" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="650" fill="url(#bg)"/>
  <rect width="1600" height="650" fill="url(#glow)"/>

  <!-- Faint dotted grid texture -->
  <g fill="#ffffff" opacity="0.04">
    <circle cx="80" cy="80" r="2"/><circle cx="160" cy="80" r="2"/><circle cx="240" cy="80" r="2"/>
    <circle cx="80" cy="160" r="2"/><circle cx="160" cy="160" r="2"/><circle cx="240" cy="160" r="2"/>
    <circle cx="1360" cy="500" r="2"/><circle cx="1440" cy="500" r="2"/><circle cx="1520" cy="500" r="2"/>
    <circle cx="1360" cy="580" r="2"/><circle cx="1440" cy="580" r="2"/><circle cx="1520" cy="580" r="2"/>
  </g>

  <!-- Large soft shopping bag, right side -->
  <g transform="translate(1180,150)" opacity="0.9">
    <path d="M40 60 L260 60 L280 400 L20 400 Z" fill="url(#bagGrad)" opacity="0.18"/>
    <path d="M100 60 C100 10 200 10 200 60" fill="none" stroke="#f5b041" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Price tag shapes floating -->
  <g opacity="0.5">
    <g transform="translate(1080,420) rotate(-15)">
      <rect x="0" y="0" width="90" height="55" rx="10" fill="none" stroke="#f5b041" stroke-width="4"/>
      <circle cx="20" cy="20" r="6" fill="#f5b041"/>
    </g>
    <g transform="translate(1300,90) rotate(20)">
      <rect x="0" y="0" width="60" height="38" rx="8" fill="none" stroke="#f5b041" stroke-width="3"/>
      <circle cx="14" cy="14" r="4" fill="#f5b041"/>
    </g>
  </g>

  <!-- Small dots / sparkle accents -->
  <g fill="#f5b041">
    <circle cx="1500" cy="220" r="4" opacity="0.7"/>
    <circle cx="1450" cy="300" r="3" opacity="0.5"/>
    <circle cx="1550" cy="380" r="5" opacity="0.6"/>
  </g>

  <!-- Subtle left accent line -->
  <rect x="0" y="0" width="6" height="650" fill="#f5b041" opacity="0.6"/>
</svg>
